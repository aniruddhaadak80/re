MEMORY {
  HDR: start = $0000, size = $0010, fill = yes, file = %O;
  TRN: start = $7000, size = $0200, fill = no, file = %O;
  PRG: start = PRGBASE, size = PRGSIZE, fill = yes, fillval = $ff, file = %O;
  CHR: start = $0000, size = CHRSIZE, fill = yes, file = %O;
}
SEGMENTS {
  HEADER:  load = HDR, type = ro;
  TRAINER: load = TRN, type = ro, optional = yes;
  CODE:    load = PRG, type = ro, start = PRGBASE;
  VECTORS: load = PRG, type = ro, start = PRGBASE + PRGSIZE - 6;
  CHARS:   load = CHR, type = ro, optional = yes;
}

name: CI

on:
  push:
    branches: [main, 'integrate/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --audit-level=low
      - name: Cache fetched fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/.cache
          key: fixtures-${{ runner.os }}-${{ hashFiles('samples/fetch-samples.mjs', 'packages/*/scripts/fetch-fixtures.mjs') }}
      - name: Fetch real world samples and package fixtures
        run: npm run fetch-fixtures
      - run: npm run build
      - run: npm run typecheck
      - name: Desktop test tools on Linux (D-Bus, AT-SPI registry, lsof)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus dbus-bin dbus-daemon at-spi2-core libglib2.0-bin lsof
      - name: Playwright Chromium for the web runtime browser tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          # the full Chromium build (not the headless shell) has the WebMCP and accessibility code the tests read
          echo "REVLENS_CHROMIUM=$(node -e "import('playwright').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - name: Test core
        run: node --test --import tsx packages/core/test/*.test.ts
      - name: Test managed
        run: node --test --import tsx packages/managed/test/*.test.ts
      - name: Test webrt
        run: node --test --import tsx packages/webrt/test/*.test.ts
      - name: Test desktop (live process, app and UI tree paths on each OS)
        run: node --test --test-concurrency=1 --import tsx packages/desktop/test/*.test.ts
      - name: Test mobile
        run: node --test --import tsx packages/mobile/test/*.test.ts
      - name: Test disasm
        run: node --test --import tsx packages/disasm/test/*.test.ts
      - name: Test extras
        run: node --test --import tsx packages/extras/test/*.test.ts
      - name: Test bridges (tools that are not installed are skipped)
        run: node --test --import tsx packages/bridges/test/*.test.ts
      - name: Test engine, CLI and MCP over stdio
        run: node --test --import tsx packages/engine/test/*.test.ts packages/cli/test/*.test.ts packages/mcp/test/*.test.ts
      - name: Generated docs and counts are in step with the code
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/gen-tool-docs.mjs --check
      - name: CLI smoke test
        shell: bash
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js analyze samples/ls-linux.elf samples/left-pad-1.3.0.tgz
          node packages/cli/dist/index.js verify samples/ls-linux.elf format=elf section=.text
          node packages/cli/dist/index.js sbom samples/react-dom.production.min.js > sbom.json
          node -e "const b=require('./sbom.json'); if(!b.components.some(c=>c.purl==='pkg:npm/react-dom@18.3.1')) process.exit(1)"
          node packages/cli/dist/index.js tools
          node packages/cli/dist/index.js doctor
          node packages/cli/dist/index.js disasm decompile samples/disasm/hello-x64.elf main
          node packages/cli/dist/index.js mobile manifest samples/mobile/apk/org.rayg.streaktracker_12.apk
          node packages/cli/dist/index.js managed dotnet samples/managed/dotnet/System.IO.Compression.Brotli.dll
          node packages/cli/dist/index.js web pcap-summary samples/webrt/dns_udp.pcap
          node packages/cli/dist/index.js extras x-checksec samples/ls-linux.elf
          node packages/cli/dist/index.js desktop ps --allow-execution --filter node --limit 5
          node packages/cli/dist/index.js desktop apps --limit 5
          node packages/cli/dist/index.js disasm match-functions samples/disasm/virt-x64.elf samples/disasm/virt-x64-stripped.elf --limit 3

  web:
    name: Web app build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End to end tests
        run: npm test
        working-directory: apps/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: apps/web/e2e/screenshots
          if-no-files-found: ignore

name: RevLens self scan

# Dogfooding: RevLens scans the code this repo ships (the built CLI, MCP server and web app
# bundles) and uploads findings of medium severity or higher to GitHub code scanning.
# Known self matches (RevLens ships its own signatures) are listed in .github/revlens-baseline.json.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:web
      - name: Scan shipped bundles to SARIF
        run: node scripts/self-scan.mjs --min medium --out revlens.sarif packages/cli/dist packages/mcp/dist apps/web/dist
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: revlens.sarif
          category: revlens

name: RevLens self scan

# Dogfooding: RevLens scans its own sample files and the built web bundle,
# then uploads SARIF to GitHub code scanning. Copy this into your own repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Analyze samples to SARIF
        run: node packages/cli/dist/index.js sarif samples/left-pad-1.3.0.tgz --out revlens.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: revlens.sarif
          category: revlens

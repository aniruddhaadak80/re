# Integration workflow for @revlens/bridges (source: packages/bridges/ci/integration.yml). It installs real tools on Ubuntu x64 and runs
# packages/bridges/test/integration.test.ts, which skips any test whose tool is missing.
name: Bridges integration

on:
  workflow_dispatch:
  push:
    branches: [main, 'integrate/**']
    paths: ['packages/bridges/**', 'samples/bridges/**', 'packages/mcp/**', 'packages/engine/**', '.github/workflows/bridges-integration.yml']
  pull_request:
    paths: ['packages/bridges/**', 'samples/bridges/**', 'packages/mcp/**', 'packages/engine/**']
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      R2_VERSION: '6.2.6'
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
      JADX_VERSION: '1.5.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: System tools (binutils, gdb, lldb, llvm, binwalk, adb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils gdb lldb llvm binwalk adb unzip python3-pip pipx
          # Frida attaches to a process it did not start
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: radare2 and r2ghidra from GitHub releases
        run: |
          curl -fsSL -o /tmp/r2.deb "https://github.com/radareorg/radare2/releases/download/${R2_VERSION}/radare2_${R2_VERSION}_amd64.deb"
          sudo apt-get install -y /tmp/r2.deb
          r2 -v
          curl -fsSL -o /tmp/r2g.zip "https://github.com/radareorg/r2ghidra/releases/download/${R2_VERSION}/r2ghidra-${R2_VERSION}-linux-x86-64.zip"
          PLUG="$(r2 -H R2_USER_PLUGINS)"
          mkdir -p "$PLUG"
          unzip -q /tmp/r2g.zip -d /tmp/r2g
          cp -r /tmp/r2g/*/* "$PLUG"/ 2>/dev/null || cp -r /tmp/r2g/* "$PLUG"/
          ls "$PLUG"

      - name: Ghidra 12.2
        run: |
          curl -fsSL -o /tmp/ghidra.zip "$GHIDRA_URL"
          unzip -q /tmp/ghidra.zip -d "$HOME"
          echo "GHIDRA_INSTALL_DIR=$(ls -d $HOME/ghidra_12.2_PUBLIC)" >> "$GITHUB_ENV"

      - name: jadx, ilspycmd and frida-tools
        run: |
          curl -fsSL -o /tmp/jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          mkdir -p "$HOME/jadx" && unzip -q /tmp/jadx.zip -d "$HOME/jadx"
          echo "JADX_HOME=$HOME/jadx" >> "$GITHUB_ENV"
          dotnet tool install --global ilspycmd --version 9.1.0.7988
          pipx install frida-tools
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install and build
        run: |
          npm ci
          npx tsc -b packages/core
          npx tsc -p packages/bridges --noEmit

      - name: Doctor
        run: |
          node --import tsx --input-type=module -e "const m = await import('./packages/bridges/src/node.ts'); const inv = await m.inventory(); console.log(m.formatInventory(inv, { verbose: true }));"

      - name: Unit, safety, setup, ADB parser and Cutter detection tests
        run: node --test --import tsx packages/bridges/test/parsers.test.ts packages/bridges/test/safety.test.ts packages/bridges/test/setup.test.ts packages/bridges/test/adb.test.ts packages/bridges/test/cutter.test.ts

      - name: Integration tests with real tools
        env:
          REVLENS_CACHE_DIR: ${{ runner.temp }}/revlens-cache
        run: node --test --test-concurrency=1 --import tsx packages/bridges/test/integration.test.ts

      - name: Sessions with real radare2, gdb, lldb and Frida
        env:
          REVLENS_CACHE_DIR: ${{ runner.temp }}/revlens-cache
        run: node --test --test-concurrency=1 --import tsx packages/bridges/test/sessions.test.ts

      - name: Names write-back with real Ghidra and radare2
        env:
          REVLENS_CACHE_DIR: ${{ runner.temp }}/revlens-cache
        run: node --test --test-concurrency=1 --import tsx packages/bridges/test/writeback.test.ts

      - name: MCP server closes bridge sessions on exit
        run: |
          npx tsc -b tsconfig.json
          node --test --test-concurrency=1 --import tsx packages/mcp/test/sessions.test.ts

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">RevLens architecture</title><desc id="d">Bytes come in from the browser, the CLI or the MCP server, pass through format detection and fifteen analyzers in @revlens/core, and come out as one report that renders to JSON, Markdown, HTML, SARIF and CycloneDX.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F5B301"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}</style>
<rect width="1200" height="620" rx="24" fill="#0A0A0B"/>
<text x="40" y="52" font-size="26" font-weight="800" fill="#FFD166">How RevLens works</text>
<text x="40" y="80" font-size="15" fill="#A8A29E">One pure TypeScript core. Three ways in. One report out.</text>
<rect x="40" y="130" width="200" height="74" rx="12" fill="#141416" stroke="#38BDF8" stroke-width="1.6"/>
<text x="140.0" y="168.0" text-anchor="middle" font-size="15" font-weight="700" fill="#38BDF8">Browser</text>
<text x="140.0" y="183.0" text-anchor="middle" font-size="12" fill="#A8A29E" class="m">Web Worker</text>
<path class="flow" d="M240 167 C 290 167, 290 330, 330 330" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="280" width="200" height="74" rx="12" fill="#141416" stroke="#14B8A6" stroke-width="1.6"/>
<text x="140.0" y="318.0" text-anchor="middle" font-size="15" font-weight="700" fill="#14B8A6">CLI</text>
<text x="140.0" y="333.0" text-anchor="middle" font-size="12" fill="#A8A29E" class="m">npx revlens</text>
<path class="flow" d="M240 317 C 290 317, 290 330, 330 330" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="430" width="200" height="74" rx="12" fill="#141416" stroke="#10B981" stroke-width="1.6"/>
<text x="140.0" y="468.0" text-anchor="middle" font-size="15" font-weight="700" fill="#10B981">MCP server</text>
<text x="140.0" y="483.0" text-anchor="middle" font-size="12" fill="#A8A29E" class="m">npx @revlens/mcp</text>
<path class="flow" d="M240 467 C 290 467, 290 330, 330 330" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="110" width="520" height="440" rx="18" fill="#101012" stroke="#F5B301" stroke-width="2"/>
<text x="350" y="142" font-size="17" font-weight="800" fill="#F5B301">@revlens/core</text>
<text x="830" y="142" text-anchor="end" font-size="12" fill="#A8A29E" class="m">Uint8Array in, Report out</text>

<rect x="350" y="440" width="480" height="46" rx="12" fill="#1A1608" stroke="#F5B301" stroke-width="1.6"/>
<text x="590.0" y="464.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F5B301">Report  revlens/report@1</text>
<text x="590.0" y="479.0" text-anchor="middle" font-size="12" fill="#A8A29E" class="m">file, sections, imports, strings, components, findings</text>
<rect x="350" y="411" width="10" height="10" rx="2" fill="#38BDF8"/><text x="366" y="420" font-size="12" fill="#A8A29E">Structure</text>
<rect x="447" y="411" width="10" height="10" rx="2" fill="#F59E0B"/><text x="463" y="420" font-size="12" fill="#A8A29E">Content</text>
<rect x="530" y="411" width="10" height="10" rx="2" fill="#14B8A6"/><text x="546" y="420" font-size="12" fill="#A8A29E">Containers</text>
<rect x="634" y="411" width="10" height="10" rx="2" fill="#10B981"/><text x="650" y="420" font-size="12" fill="#A8A29E">Supply chain</text>

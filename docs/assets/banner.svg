<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">RevLens</title>
  <desc id="d">A gold lens with file format chips orbiting around it: ELF, PE, Mach-O, WASM, XPI, VSIX, npm, JS, APK and ASAR.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B301" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F5B301" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F5B301" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F5B301"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="300" cy="190" r="70"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F1F23" stroke-width="1"/>
    </pattern>
    <path id="orbit" d="M300 190 m-225 0 a225 108 0 1 0 450 0 a225 108 0 1 0 -450 0"/>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .scan { animation: scan 3.2s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(-70px); } 50% { transform: translateY(70px); } 100% { transform: translateY(-70px); } }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
  <rect width="1200" height="380" rx="24" fill="#0A0A0B"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)" opacity="0.7"/>
  <circle cx="300" cy="190" r="190" fill="url(#glow)"/>
  <use href="#orbit" fill="none" stroke="#2A2A30" stroke-width="1.2" stroke-dasharray="4 6"/>

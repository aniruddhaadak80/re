# Scan the files your project ships with RevLens and show the findings in GitHub code scanning.
# Copy this file to .github/workflows/revlens-scan.yml and change the paths in the scan step.
name: RevLens scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Build whatever you ship first, for example: npm ci && npm run build
      - name: Scan to SARIF
        run: npx -y revlens@1 sarif dist/app.js --out revlens.sarif
      - name: Fail on high severity findings
        run: npx -y revlens@1 analyze dist/app.js --fail-on high
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: revlens.sarif
          category: revlens
